<style>
:root{--bg:#0b0c11;--bg2:#171b2e;--ink:#f3f0ea;--mut:#a9acbc;--stroke:rgba(255,255,255,.13);--hi:rgba(255,255,255,.4);--g1:rgba(255,255,255,.11);--g2:rgba(255,255,255,.035);--acc:#ead9b6;--acc2:#8d9ad8;--warm:#d8a27f;--onacc:#2a2012;--sh:rgba(0,0,0,.45);--dng:#ff9393;
--font:"Vazirmatn","Vazir","IRANSansX","IRANSans","Sahel","Segoe UI",Tahoma,system-ui,sans-serif;--lat:"Avenir Next","Helvetica Neue","Segoe UI",Arial,sans-serif}
[data-theme=light]{--bg:#e9e7e3;--bg2:#d9deec;--ink:#17181f;--mut:#5e6173;--stroke:rgba(20,22,40,.12);--hi:rgba(255,255,255,.95);--g1:rgba(255,255,255,.74);--g2:rgba(255,255,255,.38);--acc:#7a5a22;--acc2:#4b5bb0;--warm:#a35f35;--onacc:#fff;--sh:rgba(50,55,90,.2);--dng:#c23a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.8;overflow-x:hidden;transition:background .5s,color .5s}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px;border-radius:14px}
.stage{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(120% 90% at 85% -10%,var(--bg2),var(--bg))}
.orb{position:absolute;border-radius:50%;will-change:transform}
.o1{width:62vmax;height:62vmax;right:-22vmax;top:-26vmax;background:radial-gradient(circle at 35% 35%,rgba(120,134,215,.5),transparent 62%);animation:fl 28s ease-in-out infinite alternate}
.o2{width:56vmax;height:56vmax;left:-24vmax;bottom:-24vmax;background:radial-gradient(circle at 60% 40%,rgba(214,138,100,.34),transparent 62%);animation:fl 34s ease-in-out infinite alternate-reverse}
.o3{width:38vmax;height:38vmax;left:34%;top:30%;background:radial-gradient(circle,rgba(120,176,165,.2),transparent 65%);animation:fl 40s ease-in-out infinite alternate}
[data-theme=light] .orb{opacity:.6}
@keyframes fl{to{transform:translate3d(7vmax,5vmax,0) scale(1.15)}}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:3px 3px;opacity:.4}
.glass{position:relative;background:linear-gradient(135deg,var(--g1),var(--g2));border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--hi),inset 0 -1px 0 rgba(255,255,255,.05),0 20px 50px -22px var(--sh);backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%)}
.glass:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px 170px at var(--mx,25%) var(--my,0%),rgba(255,255,255,.15),transparent 70%)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 16px;border-radius:30px;margin-bottom:26px;position:sticky;top:10px;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--lat);font-weight:700;letter-spacing:.3em;font-size:12.5px;direction:ltr;background:none;border:0;padding:0}
#lgm{width:38px;height:38px;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.b{border:1px solid var(--stroke);background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:99px;padding:10px 20px;font-size:14px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 1px 0 var(--hi),0 8px 20px -10px var(--sh);transition:transform .45s cubic-bezier(.34,1.7,.5,1),background .25s,box-shadow .25s}
.b:hover{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07))}
.b:active{transform:scale(.94);transition-duration:.12s}
.b.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));color:var(--onacc);border-color:transparent;font-weight:800}
.b.dng{color:var(--dng)}.b.ghost{background:none;box-shadow:none}.b.s{padding:6px 15px;font-size:13px}
.hero{position:relative;padding:40px 6px 30px;text-align:center}
.rings{position:absolute;left:50%;top:50%;width:min(540px,94vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;pointer-events:none}
.rings b{position:absolute;inset:0;border-radius:50%;border:1px solid var(--stroke);background:conic-gradient(from 0deg,transparent 0 60%,rgba(255,255,255,.1),transparent 85%);-webkit-mask:radial-gradient(circle,transparent 66%,#000 67%);mask:radial-gradient(circle,transparent 66%,#000 67%);animation:spin 40s linear infinite}
.rings b:nth-child(2){inset:13%;animation-duration:60s;animation-direction:reverse}.rings b:nth-child(3){inset:27%;animation-duration:80s}
@keyframes spin{to{transform:rotate(360deg)}}
.herologo{width:min(150px,40vw);height:min(150px,40vw);margin:0 auto 14px;display:block}
.wm{font-family:var(--lat);direction:ltr;font-weight:300;letter-spacing:.6em;font-size:clamp(11px,2.4vw,14px);color:var(--mut);margin:0 0 10px;padding-inline-start:.6em}
h1{font-size:clamp(40px,10vw,92px);line-height:1.2;margin:0;font-weight:900;background:linear-gradient(120deg,var(--ink) 25%,var(--acc) 62%,var(--acc2));background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hs 9s ease-in-out infinite alternate}
@keyframes hs{to{background-position:100% 0}}
.slogan{font-weight:700;font-size:clamp(16px,4.2vw,22px);margin:8px 0 0;color:var(--ink);opacity:.92}
.year{display:inline-block;margin:26px 0 12px;padding:10px 24px;border-radius:99px;font-weight:700;font-size:clamp(14px,3.6vw,18px)}
.note{max-width:640px;margin:0 auto;color:var(--mut);font-size:15px}
h2{font-size:clamp(22px,5vw,32px);margin:56px 0 18px;font-weight:800}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
.tcard{position:relative;border-radius:34px;overflow:hidden;min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;isolation:isolate;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .5s cubic-bezier(.2,.9,.3,1.2),box-shadow .3s;box-shadow:0 30px 60px -26px var(--sh);animation:rise 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.12s + .15s)}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.95)}}
.tcard:active{transform:perspective(900px) scale(.98);transition-duration:.15s}
.tcard .ph{position:absolute;inset:0 0 34% 0;background-size:cover;background-position:center top;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent);transition:transform .8s}
.tcard:hover .ph{transform:scale(1.05)}
.ini{position:absolute;inset:0 0 34% 0;display:grid;place-items:center;font-size:110px;font-weight:900;opacity:.3}
.tcard .inf{padding:22px 24px 24px}

const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okUrl=u=>{try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"}catch(e){return false}};
const $=s=>document.querySelector(s);
const RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const TG="https://t.me/Talk_2_Vittobot";
function seed(){
 const mk=(title,parts)=>({id:uid(),title,parts:parts.map(p=>({id:uid(),label:p.label,url:p.url}))});
 return{theme:"dark",teachers:[
  {id:"farahani",name:"پارسا فراهانی",subject:"شیمی",style:"white",photo:PH.farahani,folders:[{id:uid(),name:"سالانه",lessons:CHEM.map(s=>mk(s.title,s.parts))}]},
  {id:"ghazati",name:"امیر قُضاتی",subject:"فیزیک",style:"navy",photo:PH.ghazati,folders:[{id:uid(),name:"سالانه",lessons:[]}]}]};
}
function clean(d){
 if(!d||typeof d!=="object"||!Array.isArray(d.teachers))throw new Error("ساختار فایل معتبر نیست.");
 const S=(v,m)=>typeof v==="string"?v.slice(0,m):"";
 const out={theme:d.theme==="light"?"light":"dark",teachers:[],sound:d.sound!==false,patches:Array.isArray(d.patches)?d.patches.filter(x=>typeof x==="string").slice(0,50):[],synced:Array.isArray(d.synced)?d.synced.filter(x=>typeof x==="string").slice(-6000):[]};
 d.teachers.forEach((t,i)=>{
  if(!t||typeof t!=="object"||!Array.isArray(t.folders))throw new Error("دبیر شماره "+fa(i+1)+" نامعتبر است.");
  const name=S(t.name,80).trim(),subject=S(t.subject,60).trim();
  if(!name)throw new Error("نام دبیر شماره "+fa(i+1)+" خالی است.");
  const photo=S(t.photo,1200000);
  if(photo&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(photo))throw new Error("تصویر «"+name+"» نامعتبر است.");
  out.teachers.push({id:S(t.id,40)||uid(),name,subject,style:["navy","white","glass"].includes(t.style)?t.style:"glass",photo,
   folders:t.folders.map(f=>{
    if(!f||!Array.isArray(f.lessons))throw new Error("پوشه‌ای در «"+name+"» نامعتبر است.");
    return{id:S(f.id,40)||uid(),name:S(f.name,80).trim()||"پوشه",lessons:f.lessons.map(l=>{
     if(!l||!Array.isArray(l.parts))throw new Error("جلسه‌ای در «"+name+"» نامعتبر است.");
     return{id:S(l.id,40)||uid(),title:S(l.title,120).trim()||"جلسه",seen:!!l.seen,parts:l.parts.map(p=>{
      const url=S(p&&p.url,2000).trim();
      if(url&&!okUrl(url))throw new Error("لینک نامعتبر در «"+S(l.title,60)+"»");

async function syncNow(manual){if(!/^https?:$/.test(location.protocol)){if(manual)toast("به‌روزرسانی خودکار فقط وقتی کار می‌کند که برنامه از یک آدرس اینترنتی باز شده باشد.");return}
 try{const r=await fetch("classes.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const jj=await r.json();if(MODE==="reader"){readerApply(jj,manual);return}const res=mergeFeed(jj);save();
  if(res.nl||res.nk){render();toast("به‌روزرسانی شد: "+fa(res.nl)+" جلسهٔ جدید و "+fa(res.nk)+" لینک جدید")}else if(manual)toast("همه‌چیز به‌روز است.")}
 catch(e){if(manual)toast("فایل کلاس‌ها پیدا نشد یا اینترنت قطع است.")}}
$("#rdf").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const j=JSON.parse(await f.text());if(!j||!Array.isArray(j.teachers))throw new Error("این فایل، فایل کلاس‌ها نیست.");readerApply(j,true)}catch(err){toast("بارگذاری انجام نشد: "+(err&&err.message&&!/JSON|Unexpected/.test(err.message)?err.message:"فایل معتبر نیست."))}};
$("#mrg").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;try{const r=mergeFeed(JSON.parse(await f.text()));save();render();toast(r.nl||r.nk?"اضافه شد: "+fa(r.nl)+" جلسهٔ جدید و "+fa(r.nk)+" لینک جدید":"چیز جدیدی در این فایل نبود.")}catch(err){toast("ادغام انجام نشد: "+(err&&err.message&&!/JSON|Unexpected/.test(err.message)?err.message:"فایل معتبر نیست."))}};
if(MODE==="reader")initReader();sndLabel();applyTheme();save();route();if(MODE==="reader")syncNow(false);
</script>
